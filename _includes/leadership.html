{% assign leadership = site.data.data.leadership %}
{% if leadership %}
<section class="section experiences-section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-users fa-stack-1x fa-inverse"></i>
    </span>
    {{ leadership.title }}
  </h2>
  {% for experience in leadership.info %}
  <div class="item">
    <div class="meta">
      <div class="upper-row">
        <h3 class="job-title">{{ experience.role }}</h3>
        <div class="time">{{ experience.time }}</div>
      </div>
      <div class="company">{{ experience.company }}</div>
    </div>
    {% if experience.details %}<div class="details"><p>{{ experience.details }}</p></div>{% endif %}
  </div>
  {% endfor %}
</section>
{% endif %}
