career-profile:
  title: Research Profile
  summary: |
    I am a software researcher interested in embodied AI, robot locomotion, and efficient machine learning. My current research focuses on terrain-aware cross-embodiment locomotion: developing shared low-level control policies that generalize across diverse robot morphologies and unseen terrains by jointly conditioning on morphology and perceptive terrain information.

